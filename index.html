<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幕幕光影 · 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 电影院光束背景 -->
  <div class="scene">
    <div class="beam beam--1"></div>
    <div class="beam beam--2"></div>
    <div class="beam beam--3"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- 漂浮胶片格 -->
  <div class="reels" aria-hidden="true">
    <span class="cell"></span><span class="cell"></span><span class="cell"></span>
    <span class="cell"></span><span class="cell"></span><span class="cell"></span>
  </div>

  <main class="stage">
    <section class="ticket" role="form" aria-label="登录">
      <!-- 票根缺口装饰 -->
      <span class="notch notch--t"></span>
      <span class="notch notch--b"></span>

      <div class="ticket__brand">
        <svg class="clapper" viewBox="0 0 64 64" width="46" height="46" aria-hidden="true">
          <g class="clapper__top">
            <rect x="6" y="10" width="52" height="16" rx="3" fill="#f5c542"/>
            <path d="M6 13l52 10M16 10l-6 16M30 11l-6 16M44 12l-6 16M58 13l-6 16" stroke="#1a1320" stroke-width="2"/>
          </g>
          <rect class="clapper__stick" x="30" y="26" width="4" height="30" rx="2" fill="#f5c542"/>
        </svg>
        <div class="brand__text">
          <h1>幕幕光影</h1>
          <p>CINÉ · 进入你的私人影院</p>
        </div>
      </div>

      <p class="ticket__hint">放映还未开始，请先检票入场。</p>

      <form id="loginForm" novalidate>
        <label class="field">
          <span class="field__label">账号</span>
          <div class="field__box">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6Z"/></svg>
            <input id="account" type="text" autocomplete="username" placeholder="手机号 / 邮箱" />
          </div>
          <em class="field__err" data-for="account"></em>
        </label>

        <label class="field">
          <span class="field__label">密码</span>
          <div class="field__box">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2Zm-8 0V7a3 3 0 0 1 6 0v2H9Zm3 4a2 2 0 0 1 1 3.7V19h-2v-2.3A2 2 0 0 1 12 13Z"/></svg>
            <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
            <button type="button" class="eye" id="togglePwd" aria-label="显示密码">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7Zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
            </button>
          </div>
          <em class="field__err" data-for="password"></em>
        </label>

        <div class="row">
          <label class="remember"><input type="checkbox" id="remember" /> 记住我</label>
          <a class="link" href="#" id="forgot">忘记密码？</a>
        </div>

        <button type="submit" class="enter">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          进入影院
        </button>
      </form>

      <div class="divider"><span>其他检票方式</span></div>
      <div class="socials">
        <button class="social" type="button" aria-label="微信登录">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 4C5 4 2 6.7 2 10c0 1.9 1 3.5 2.7 4.6L4 17l2.6-1.3c.8.2 1.6.3 2.4.3h.6A5.6 5.6 0 0 1 9 13c0-3 3-5.3 6.6-5.3h.4C15.4 6 12.4 4 9 4Zm-2 4.2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm4 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm9 2.8c0-2.6-2.6-4.7-5.8-4.7S10.4 9.4 10.4 12c0 2.6 2.6 4.7 5.8 4.7.7 0 1.4-.1 2-.3L20 17.5l-.5-1.8c1.4-.9 2.5-2.2 2.5-3.7Zm-7.7-.9a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Zm3.8 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Z"/></svg>
        </button>
        <button class="social" type="button" aria-label="Apple 登录">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16 3c.1 1.2-.4 2.3-1.1 3.1-.8.9-2 1.5-3.1 1.4-.1-1.2.4-2.4 1.1-3.1C13.7 3.4 15 2.9 16 3Zm3.3 16.3c-.5 1.2-.8 1.7-1.4 2.8-.9 1.4-2.2 3.1-3.8 3.1-1.4 0-1.8-.9-3.7-.9s-2.4.9-3.7.9c-1.6 0-2.9-1.6-3.8-3C.6 18.7-.3 14.6 1.7 11.6c1-1.6 2.6-2.6 4.2-2.6 1.6 0 2.6 1 3.9 1 1.3 0 2-1 3.9-1 1.4 0 2.9.8 3.9 2.1-3.4 1.9-2.9 6.8 1.7 7.7Z"/></svg>
        </button>
        <button class="social" type="button" aria-label="Google 登录">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.4 14.6 2.5 12 2.5 6.9 2.5 2.8 6.6 2.8 11.7S6.9 20.9 12 20.9c5.3 0 8.8-3.7 8.8-9 0-.6-.1-1.1-.2-1.6H12Z"/></svg>
        </button>
      </div>

      <p class="signup">还没有账号？<a href="#" id="signup">立即购票注册</a></p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
