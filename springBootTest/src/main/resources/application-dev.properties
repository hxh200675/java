server.port=8081

# ========== MySQL 数据源（root / 123456） ==========
# createDatabaseIfNotExist=true 会在数据库不存在时自动建库
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== 自动执行建表脚本（每次启动执行，CREATE TABLE IF NOT EXISTS 幂等） ==========
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ========== 文件上传（头像，最大 5MB） ==========
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ========== MyBatis-Plus 配置 ==========
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto
